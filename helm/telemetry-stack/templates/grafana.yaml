apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telemetry.fullname" . }}-grafana-datasources
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
data:
  all.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://{{ include "telemetry.fullname" . }}-prometheus:9090
        jsonData:
          httpMethod: GET
      - name: Loki
        type: loki
        access: proxy
        url: http://{{ include "telemetry.fullname" . }}-loki:3100
        isDefault: false
      - name: Tempo
        type: tempo
        access: proxy
        uid: tempo
        url: http://{{ include "telemetry.fullname" . }}-tempo:3200
        isDefault: false
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: 'prometheus'
          tracesToLogs:
            datasourceUid: Loki
            filterByTraceID: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telemetry.fullname" . }}-grafana
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: {{ .Values.grafana.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 472
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          ports:
            - containerPort: 3000
          env:
            - name: GF_SERVER_ROOT_URL
              value: "https://{{ .Values.grafana.domain }}"
            - name: GF_SERVER_DOMAIN
              value: {{ .Values.grafana.domain }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_USERS_AUTO_ASSIGN_ORG
              value: "true"
            - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
              value: "Admin"
            {{- if .Values.grafana.auth.proxy.enabled }}
            - name: GF_AUTH_PROXY_ENABLED
              value: "true"
            - name: GF_AUTH_PROXY_HEADER_NAME
              value: {{ .Values.grafana.auth.proxy.headerName }}
            - name: GF_AUTH_PROXY_HEADER_PROPERTY
              value: "email"
            - name: GF_AUTH_PROXY_AUTO_SIGN_UP
              value: "true"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN
              value: "false"
            - name: GF_AUTH_DISABLE_SIGNOUT_MENU
              value: "true"
            {{- end }}
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: {{ include "telemetry.fullname" . }}-grafana-datasources
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "telemetry.fullname" . }}-grafana
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry.fullname" . }}-grafana
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "telemetry.fullname" . }}-grafana
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.grafana.storage }}

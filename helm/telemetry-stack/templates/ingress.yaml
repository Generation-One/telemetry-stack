{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "telemetry.fullname" . }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tlsEnabled .Values.ingress.clusterIssuer (not .Values.ingress.tlsSecretName) }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsEnabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" (include "telemetry.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if .Values.oauth2Proxy.enabled }}
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: {{ include "telemetry.fullname" . }}-oauth2-proxy
                port:
                  number: 4180
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "telemetry.fullname" . }}-grafana
                port:
                  number: 3000
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telemetry.fullname" . }}-tempo-config
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
data:
  tempo-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"
    storage:
      trace:
        backend: local
        wal:
          path: /tmp/tempo/wal
        local:
          path: /tmp/tempo/blocks
    memberlist:
      abort_if_cluster_join_fails: false
    overrides:
      defaults:
        metrics_generator:
          processors: [local-blocks]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telemetry.fullname" . }}-tempo
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  replicas: {{ .Values.tempo.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: tempo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tempo
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 10001:10001 /tmp/tempo"]
          volumeMounts:
            - name: data
              mountPath: /tmp/tempo
      containers:
        - name: tempo
          image: {{ .Values.tempo.image }}
          args:
            - -config.file=/etc/tempo/tempo-config.yaml
            - -target=all
          ports:
            - containerPort: 3200
              name: http
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: config
              mountPath: /etc/tempo/tempo-config.yaml
              subPath: tempo-config.yaml
            - name: data
              mountPath: /tmp/tempo
      volumes:
        - name: config
          configMap:
            name: {{ include "telemetry.fullname" . }}-tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "telemetry.fullname" . }}-tempo
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry.fullname" . }}-tempo
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  ports:
    - port: 3200
      targetPort: 3200
      name: http
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
  selector:
    app.kubernetes.io/component: tempo
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "telemetry.fullname" . }}-tempo
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.tempo.storage }}

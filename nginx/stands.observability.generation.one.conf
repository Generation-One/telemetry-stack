server {

    set $forward_scheme http;
    set $server         "localhost";
    set $port           3215;
    server_name stands.observability.generation.one;

    #
    # AUTH CHECK (required!!)
    #
    location = /oauth2/auth {
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    #
    # AUTH PROXY ENDPOINTS
    #
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }


    location @oauth2_signin {
        return 302 /oauth2/start?rd=$scheme://$host$request_uri;
    }

    #
    # PROTECTED APPLICATION
    #
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;

        proxy_pass http://127.0.0.1:3215;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stands.observability.generation.one/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stands.observability.generation.one/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = stands.observability.generation.one) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name stands.observability.generation.one;
    return 404; # managed by Certbot


}

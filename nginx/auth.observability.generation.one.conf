server {
    server_name auth.observability.generation.one;

    # Required for OAuth authentication flow
    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/auth.observability.generation.one/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/auth.observability.generation.one/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = auth.observability.generation.one) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name auth.observability.generation.one;
    return 404; # managed by Certbot


}
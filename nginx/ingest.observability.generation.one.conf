server {
    server_name ingest.observability.generation.one;

    if ($http_x_otel_secret != "781WqRLF4M5XrZNnqH7eaBMK8P4/Fks+rJfCYv7Sx/c=") {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:4318;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ingest.observability.generation.one/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ingest.observability.generation.one/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = ingest.observability.generation.one) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ingest.observability.generation.one;
    return 404; # managed by Certbot


}